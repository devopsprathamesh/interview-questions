---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install web server package
  ansible.builtin.package:
    name: "{{ webserver_package }}"
    state: present

- name: Ensure docroot exists
  ansible.builtin.file:
    path: "{{ webserver_docroot }}"
    state: directory
    mode: "0755"

- name: Template the index page from live facts
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_docroot }}/index.html"
    mode: "0644"
  notify: restart nginx

- name: Ensure a marker line is present in the default nginx site config
  ansible.builtin.lineinfile:
    path: /etc/nginx/sites-available/default
    regexp: '^# managed-by-ansible-lab01'
    line: '# managed-by-ansible-lab01'
    insertafter: BOF
  notify: restart nginx

- name: Ensure nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
