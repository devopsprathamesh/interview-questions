name: terraform

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
  schedule:
    # Scheduled drift-detection run - see docs/cicd.md §8. Every day at 06:00 UTC.
    - cron: "0 6 * * *"

# One in-flight run per environment at a time. Never cancel an in-flight
# apply mid-run - see docs/cicd.md §6 and interview-questions/08-cicd.md
# Question 72.
concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC - see docs/terraform-architecture.md §5
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"

jobs:
  validate:
    name: fmt, validate, lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (per environment)
        run: |
          for dir in environments/*/; do
            echo "== validating $dir =="
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          for dir in environments/*/ modules/*/; do
            tflint --chdir="$dir" --config="$(pwd)/.tflint.hcl" || exit 1
          done

  test:
    name: module tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Run terraform test for every module
        run: |
          for dir in modules/*/; do
            if [ -d "${dir}tests" ]; then
              echo "== testing $dir =="
              (cd "$dir" && terraform init -backend=false -input=false && terraform test)
            fi
          done

  security-scan:
    name: security & policy scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: environments
          quiet: true
          soft_fail: false

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    strategy:
      matrix:
        environment: [dev, staging, production]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -backend-config=backend.hcl

      - name: terraform plan
        run: terraform plan -out=tfplan -input=false

      - name: Render plan for review
        run: terraform show -json tfplan > plan.json

      - name: Policy-as-code check (Conftest)
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.53.0/conftest_0.53.0_Linux_x86_64.tar.gz | tar xz
          ./conftest test plan.json --policy ../../policies

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan
          retention-days: 5

      - name: Post plan summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = `Terraform plan for **${{ matrix.environment }}** completed. See workflow run for full output.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });

  apply:
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        environment: [dev, staging, production]
      max-parallel: 1 # environments apply one at a time: dev, then staging, then production
    environment: ${{ matrix.environment }} # production requires a manual approval gate configured in repo settings
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Download the exact reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}

      - name: terraform apply (the exact saved plan - never a fresh one)
        run: terraform apply tfplan

  drift-detection:
    name: scheduled drift detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        environment: [dev, staging, production]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -backend-config=backend.hcl
      - name: Plan-only drift check
        id: drift
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
      - name: Alert on detected drift
        if: steps.drift.outputs.exitcode == '2'
        run: echo "::warning::Drift detected in ${{ matrix.environment }} - see interview-questions/10-troubleshooting.md"
      - name: Fail on plan error (exit code 1)
        if: steps.drift.outputs.exitcode == '1'
        run: exit 1
