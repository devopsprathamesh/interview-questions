apiVersion: v1
kind: Namespace
metadata:
  name: netpol-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-service
  namespace: netpol-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: target-service }
  template:
    metadata:
      labels: { app: target-service }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: target-service
  namespace: netpol-test
spec:
  selector: { app: target-service }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: netpol-test
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  # No ingress rules specified = deny all ingress by default -
  # only meaningful if something is actually enforcing NetworkPolicy at all.
