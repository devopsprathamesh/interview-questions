apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: my-app }
  template:
    metadata:
      labels: { app: my-app }
    spec:
      containers:
        - name: my-app
          image: my-registry/my-app@sha256:REPLACE_ME   # updated by CI with the actual built digest
          ports: [{ containerPort: 8080 }]
