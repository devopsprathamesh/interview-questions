apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-immediate
provisioner: ebs.csi.aws.com
volumeBindingMode: Immediate   # PV created before any pod is scheduled - AZ mismatch risk
parameters: { type: gp3, encrypted: "true" }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-wffc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer   # PV created in the scheduled pod's actual AZ
parameters: { type: gp3, encrypted: "true" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-immediate-test
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ebs-immediate
  resources: { requests: { storage: 4Gi } }
