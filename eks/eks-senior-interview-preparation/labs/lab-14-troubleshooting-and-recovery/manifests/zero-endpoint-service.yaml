apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend-app, tier: backend }
  template:
    metadata:
      labels: { app: backend-app, tier: backend }
    spec:
      containers:
        - name: app
          image: nginx:1.25
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: zero-endpoint-service
spec:
  selector:
    app: backend-app
    tier: backedn   # TYPO: "backedn" instead of "backend" - selector mismatch
  ports: [{ port: 80, targetPort: 80 }]
