apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lab03-s3-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unintended-sa
  namespace: default
  # Deliberately NO IRSA annotation - this pod will attempt to assume the
  # role by explicitly calling sts:AssumeRoleWithWebIdentity using its own
  # projected token, simulating any-pod-in-cluster access under the broken
  # trust policy.
