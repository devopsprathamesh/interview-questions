apiVersion: v1
kind: Pod
metadata:
  name: pod-noncompliant
  namespace: restricted-test
spec:
  containers:
    - name: app
      image: nginx:1.25
      securityContext:
        runAsUser: 0          # runs as root - violates "restricted"
        privileged: true       # violates "restricted"
        allowPrivilegeEscalation: true
