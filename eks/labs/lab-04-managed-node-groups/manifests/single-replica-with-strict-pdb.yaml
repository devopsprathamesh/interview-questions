apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-replica-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: single-replica-app }
  template:
    metadata:
      labels: { app: single-replica-app }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: single-replica-pdb
spec:
  minAvailable: 1   # unsatisfiable against a single-replica Deployment - drain will stall
  selector:
    matchLabels: { app: single-replica-app }
