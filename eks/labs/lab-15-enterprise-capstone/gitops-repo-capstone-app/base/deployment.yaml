apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: capstone-app
spec:
  replicas: 4
  selector:
    matchLabels: { app: capstone-app }
  template:
    metadata:
      labels: { app: capstone-app }
    spec:
      serviceAccountName: capstone-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: nginxdemos/hello:latest
          ports: [{ containerPort: 80 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
  strategy:
    canary:
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: scoped-error-rate
        - setWeight: 50
        - pause: { duration: 1m }
        - setWeight: 100
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-app-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/capstone-app-role
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-app
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
spec:
  selector: { app: capstone-app }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: capstone-app, port: { number: 80 } }
