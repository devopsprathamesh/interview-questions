apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "58.x"
    helm:
      valueFiles: ["$values/labs/lab-09-observability-stack/helm/kube-prometheus-stack-values.yaml"]
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "58.x"
      helm:
        valueFiles: ["$values/labs/lab-09-observability-stack/helm/kube-prometheus-stack-values.yaml"]
    - repoURL: https://github.com/YOUR_USERNAME/YOUR_FORK.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
