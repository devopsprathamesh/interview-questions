apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-baseline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/YOUR_FORK.git
    targetRevision: main
    path: labs/lab-13-policy-as-code-opa/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
